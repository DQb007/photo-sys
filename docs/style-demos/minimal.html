<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>极简高级感 Demo</title>
  <style>
    :root{color-scheme:light;--bg:#f5f2eb;--ink:#181714;--muted:#777067;--line:#d8d0c2;--panel:#fffdf8;--accent:#111;--soft:#ece6da;--shadow:0 18px 54px rgba(30,26,18,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Avenir Next","Aptos","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:34px 24px;border-right:1px solid var(--line);background:#f9f6ef}.brand{margin-bottom:52px}.brand strong{display:block;font-family:Georgia,"Noto Serif SC",serif;font-size:24px;letter-spacing:-.04em}.brand span,.muted,nav a{color:var(--muted)}nav{display:grid;gap:3px}nav a{text-decoration:none;padding:13px 0;border-bottom:1px solid transparent;display:flex;justify-content:space-between}nav a.active,nav a:hover{color:var(--ink);border-bottom-color:var(--ink)}main{padding:42px}.top{display:grid;grid-template-columns:1fr 220px;gap:30px;align-items:end;margin-bottom:28px}.eyebrow{margin:0 0 14px;color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase}.title{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(46px,8vw,104px);line-height:.86;letter-spacing:-.08em;margin:0;max-width:900px}.credit{border-top:1px solid var(--ink);padding-top:12px}.credit strong{display:block;font-size:36px;letter-spacing:-.05em}.workspace{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.form{padding:24px}.field{display:grid;gap:8px;margin-bottom:18px}.field span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.16em}textarea,input,button{font:inherit}textarea,input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 0;outline:none}textarea{min-height:190px;resize:vertical;line-height:1.8}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload{background:var(--soft);padding:18px;margin:18px 0;color:var(--muted);text-align:center}.primary{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:15px;font-weight:800;letter-spacing:.04em}.result{padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}.bar h2{margin:0;font-family:Georgia,"Noto Serif SC",serif;font-size:28px;letter-spacing:-.04em}.gallery{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;min-height:500px}.image{background-size:cover;background-position:center;position:relative}.image:first-child{grid-row:span 2;background-image:url('https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=1100&q=80')}.image:nth-child(2){background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80')}.image:nth-child(3){background-image:url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=900&q=80')}.image span{position:absolute;left:12px;bottom:12px;background:#fff;padding:8px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:22px}.stats div{padding:14px 0}.stats strong{display:block;font-size:24px}.back{position:fixed;right:18px;top:18px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}@media(max-width:980px){.app,.top,.workspace{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.gallery{min-height:360px}}
  </style>
</head>
<body><a class="back" href="index.html">返回总览</a><div class="app"><aside class="side"><div class="brand"><strong>炫步 AI</strong><span>Quiet creation system</span></div><nav><a class="active">图片生成 <span>01</span></a><a>生成历史 <span>02</span></a><a>提示词库 <span>03</span></a><a>AI 对话 <span>04</span></a></nav></aside><main><section class="top"><div><p class="eyebrow">Minimal Image System</p><h1 class="title">让画面自己说话</h1></div><div class="credit"><span class="muted">当前积分</span><strong>2480</strong></div></section><section class="workspace"><form class="panel form"><label class="field"><span>Prompt</span><textarea>quiet morning landscape, single figure, natural light, refined composition, restrained color palette.</textarea></label><div class="row"><label class="field"><span>Size</span><input value="1024 x 1024"></label><label class="field"><span>Quality</span><input value="High"></label></div><div class="upload">上传参考图，可选</div><button class="primary">开始生成</button><div class="stats"><div><span class="muted">排队</span><strong>03</strong></div><div><span class="muted">完成</span><strong>128</strong></div><div><span class="muted">收藏</span><strong>46</strong></div></div></form><section class="panel result"><div class="bar"><h2>生成结果</h2><span class="muted">00:18</span></div><div class="gallery"><div class="image"><span>01</span></div><div class="image"><span>02</span></div><div class="image"><span>03</span></div></div></section></section></main></div></body>
</html>

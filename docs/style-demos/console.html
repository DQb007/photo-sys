  <style>
    :root{color-scheme:dark;--bg:#05080b;--panel:#081016;--panel2:#0d1820;--ink:#e9fbff;--muted:#7f9ba6;--line:rgba(117,244,255,.2);--cyan:#24f1ff;--lime:#b8ff65;--pink:#ff4fd8;--danger:#ff5c72}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Bahnschrift","Aptos","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 18%,rgba(36,241,255,.18),transparent 28%),radial-gradient(circle at 82% 20%,rgba(255,79,216,.16),transparent 30%),linear-gradient(135deg,#040608,#071018 60%,#09070d)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 85%)}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:22px;border-right:1px solid var(--line);background:rgba(5,8,11,.78);box-shadow:inset -1px 0 0 rgba(36,241,255,.14)}.brand{border:1px solid var(--line);padding:14px;border-radius:4px;background:linear-gradient(135deg,rgba(36,241,255,.1),rgba(255,79,216,.06));margin-bottom:24px}.brand strong{display:block;font-size:20px;letter-spacing:.08em}.brand span,.muted,nav a{color:var(--muted)}nav{display:grid;gap:8px}nav a{text-decoration:none;border:1px solid rgba(117,244,255,.12);padding:12px 13px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;background:rgba(255,255,255,.025)}nav a.active,nav a:hover{color:var(--cyan);border-color:rgba(36,241,255,.48);box-shadow:0 0 22px rgba(36,241,255,.1)}main{padding:28px}.top{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-bottom:18px}.hero{border:1px solid var(--line);background:rgba(8,16,22,.78);padding:22px;position:relative;overflow:hidden}.hero:after{content:"SYS ONLINE";position:absolute;right:18px;top:18px;color:var(--lime);font-size:12px;letter-spacing:.22em}.eyebrow{margin:0 0 10px;color:var(--cyan);letter-spacing:.28em;text-transform:uppercase;font-size:12px}h1{margin:0;font-size:clamp(36px,6vw,78px);line-height:.88;letter-spacing:-.06em;text-transform:uppercase}.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}.op{border:1px solid var(--line);background:rgba(8,16,22,.8);padding:16px}.op strong{display:block;font-size:30px;color:var(--lime)}.workspace{display:grid;grid-template-columns:420px 1fr;gap:18px}.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,16,22,.92),rgba(8,16,22,.62));box-shadow:0 0 0 1px rgba(36,241,255,.05),0 28px 80px rgba(0,0,0,.42)}.form{padding:18px}.field{display:grid;gap:8px;margin-bottom:14px}.field span{color:var(--cyan);font-size:12px;letter-spacing:.16em;text-transform:uppercase}textarea,input,button{font:inherit}textarea,input{width:100%;border:1px solid rgba(117,244,255,.22);background:#04090d;color:var(--ink);padding:13px;outline:none}textarea{min-height:172px;line-height:1.65}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:1px dashed rgba(184,255,101,.44);color:var(--lime);padding:15px;margin:14px 0;background:rgba(184,255,101,.05)}.primary{width:100%;border:1px solid rgba(36,241,255,.64);background:linear-gradient(90deg,rgba(36,241,255,.18),rgba(255,79,216,.18));color:var(--ink);padding:14px;text-transform:uppercase;letter-spacing:.16em;font-weight:900}.result{padding:14px}.title{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:12px}.title h2{margin:0;text-transform:uppercase;letter-spacing:.12em}.screen{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;min-height:500px}.feed{border:1px solid rgba(117,244,255,.18);background-size:cover;background-position:center;position:relative}.feed.big{grid-row:span 2;background-image:linear-gradient(rgba(5,8,11,.08),rgba(5,8,11,.42)),url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1100&q=80')}.feed.one{background-image:url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=900&q=80')}.feed.two{background-image:url('https://images.unsplash.com/photo-1517976487492-5750f3195933?auto=format&fit=crop&w=900&q=80')}.feed span{position:absolute;left:10px;bottom:10px;border:1px solid var(--line);background:rgba(5,8,11,.72);color:var(--cyan);padding:7px 10px}.log{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.log div{border:1px solid rgba(117,244,255,.14);padding:12px;background:rgba(255,255,255,.025)}.back{position:fixed;right:18px;top:18px;color:var(--cyan);text-decoration:none;font-weight:900}@media(max-width:980px){.app,.top,.workspace{grid-template-columns:1fr}.screen{min-height:380px}}
